# pnpm 11+ requires git-hosted packages with build scripts to be allowlisted
# before `pnpm install` will run their `prepare` script. mermaid-mini is a
# private fork that builds at install-time (see its package.json's prepare).
allowBuilds:
  mermaid-mini@https://codeload.github.com/wizlijun/mermaid-mini/tar.gz/05c0e8817ab516e42c1e366a0c00948b23da1442: true
  esbuild: true
  sharp: true
  workerd: true

# @moraya/core loads Mermaid as an optional peer while mermaid-mini re-exports
# it from its own dependency. Keep both product paths on the same audited build.
overrides:
  mermaid: 11.17.2
  # Svelte's compatible devalue range includes the three GHSA fixes in 5.9.3.
  devalue@<5.9.3: 5.9.3
  # GHSA-c8x8-7fp4-3x9w: validate pasted HTML in every editor dependency path.
  prosemirror-view@<1.42.3: 1.42.3
  # Editor Node/Fragment identity must be shared with the patched view.
  prosemirror-model: 1.25.11

packages:
  - 'plugins-src/*'
