<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#111;color:#ccc;font:14px system-ui;margin:0}header{height:56px;display:flex;gap:8px;align-items:center;padding:0 20px}button{background:#333;color:#eee;border:1px solid #555;border-radius:5px;padding:8px}#state{position:absolute;bottom:0;height:100px;white-space:pre-wrap;overflow:auto;padding:12px;font:12px monospace}#overlay{display:none;position:absolute;left:150px;top:150px;background:#ccc;color:#111;padding:80px}
</style></head><body><header><b>Sumi Native Probe</b><button onclick="call('focus_editor')">Focus</button><button onclick="call('remote_edit')">Remote edit</button><button onclick="call('snapshot')">Snapshot</button><button onclick="overlay()">Overlay</button><button onclick="call('quit')">Quit</button></header><div id="overlay">Web overlay — native surface hidden</div><div id="state">Isolated test window. Native NSTextView occupies the central area.</div><script>
async function call(name,args={}){try{const result=await window.__TAURI_INTERNALS__.invoke(name,args);document.querySelector('#state').textContent=JSON.stringify(result,null,2);return result}catch(e){document.querySelector('#state').textContent=String(e)}}let hidden=false;async function overlay(){hidden=!hidden;await call('visibility',{visible:!hidden});document.querySelector('#overlay').style.display=hidden?'block':'none'}
</script></body></html>
