packages:
  - .

# Wrangler/Vitest runtime binaries have audited install scripts. pnpm 11 blocks
# all dependency build scripts unless they are explicitly allow-listed.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260911.1'
  - miniflare@5.20260910.0-alpha
  - wrangler@4.131.0
  - '@cloudflare/vitest-plugin@1.1.7'
