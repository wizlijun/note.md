[package]
name = "notemd-conversation-dictionary"
version = "0.1.2"
edition = "2021"

[lib]
name = "notemd_conversation_dictionary"
path = "src/lib.rs"

[[bin]]
name = "notemd-conversation-dictionary"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
unicode-normalization = "0.1"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
