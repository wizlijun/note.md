[package]
name = "notemd-typst-reader"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "notemd-typst-reader"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
pulldown-cmark = "0.13"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
typst = "0.15.1"
typst-kit = { version = "0.15.1", features = ["scan-fonts", "embedded-fonts"] }
typst-utils = "0.15.1"
comemo = "0.5"
typst-layout = "0.15.1"
typst-svg = "0.15.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
