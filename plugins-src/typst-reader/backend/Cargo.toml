[package]
name = "notemd-typst-reader"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "notemd-typst-reader"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
pulldown-cmark = "0.13"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
typst = "0.15.1"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
typst-layout = "0.15.1"
typst-svg = "0.15.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
