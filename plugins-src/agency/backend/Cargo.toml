[package]
name = "notemd-agency"
version = "0.3.0"
edition = "2021"

[lib]
name = "notemd_agency"
path = "src/lib.rs"

[[bin]]
name = "notemd-agency"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
