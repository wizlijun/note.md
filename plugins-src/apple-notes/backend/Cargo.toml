[package]
name = "notemd-apple-notes"
version = "1.0.0"
edition = "2021"

[lib]
name = "notemd_apple_notes"
path = "src/lib.rs"

[[bin]]
name = "notemd-apple-notes"
path = "src/main.rs"

[dependencies]
notemd-plugin-sdk = { path = "../../../notemd-plugin-sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
html2md = "0.2"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
