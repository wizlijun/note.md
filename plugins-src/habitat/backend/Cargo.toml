[package]
name = "notemd-habitat"
version = "0.1.0"
edition = "2021"

[dependencies]
habitat-core = { path = "../../../habitat-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
