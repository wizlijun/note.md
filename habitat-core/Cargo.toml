[package]
name = "habitat-core"
version = "0.1.0"
edition = "2021"
description = "Local, evidence-backed Vault knowledge snapshots and semantic history"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-normalization = "0.1"
jieba-rs = "0.10"
regex = "1"
zstd = "0.13.3"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
