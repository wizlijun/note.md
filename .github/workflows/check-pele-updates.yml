name: Check Pele updates

on:
  schedule:
    # Monday 09:00 in Asia/Taipei (UTC+8).
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare pinned Pele with npm latest
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const current = JSON.parse(readFileSync('package.json', 'utf8')).dependencies?.pele
          const stableVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
          if (typeof current !== 'string' || !stableVersion.test(current)) {
            throw new Error('Pele must be pinned to an exact stable version in package.json')
          }
          const response = await fetch('https://registry.npmjs.org/pele/latest', {
            signal: AbortSignal.timeout(15_000),
            headers: { Accept: 'application/json' },
          })
          if (!response.ok) throw new Error(`npm registry returned HTTP ${response.status}`)
          const metadata = await response.json()
          const latest = metadata?.version
          if (metadata?.name !== 'pele' || typeof latest !== 'string' || !stableVersion.test(latest)) {
            throw new Error('npm registry returned invalid Pele stable release metadata')
          }
          const installedParts = current.split('.').map(BigInt)
          const latestParts = latest.split('.').map(BigInt)
          const difference = latestParts.findIndex((part, index) => part !== installedParts[index])
          const available = difference !== -1 && latestParts[difference] > installedParts[difference]
          const status = available ? 'A newer stable Pele release is available for review.' : 'No newer stable Pele release is available.'
          const summary = [
            '## Pele update check',
            '',
            `- Current pin: **${current}**`,
            `- npm latest: **${latest}**`,
            `- ${status}`,
            `- [npm release](https://www.npmjs.com/package/pele/v/${latest}) · [Release metadata](https://registry.npmjs.org/pele/${latest})`,
            '',
            'Check only: dependency upgrades and releases require a separate review.',
            '',
          ].join('\n')
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          console.log(`Pele: current ${current}; latest ${latest}. ${status}`)
          if (available) console.log(`::notice title=Pele update available::Pele ${latest} is newer than pinned ${current}. Review compatibility and the diagram gallery before upgrading.`)
          NODE
