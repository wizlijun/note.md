name: Deploy share worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # worker/ has its own lockfile and Wrangler devDependency. Install that
      # pinned toolchain, then invoke Wrangler directly instead of asking a
      # wrapper action to discover or install a package manager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: worker
      - name: Deploy mdeditor-share to Cloudflare Workers
        run: pnpm exec wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
