name: Deploy plugins registry worker

on:
  push:
    branches: [main]
    paths:
      - "plugins-registry/**"
      - ".github/workflows/deploy-plugins-registry.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # plugins-registry has its own lockfile and Wrangler devDependency. Use
      # that pinned toolchain directly so deployment does not depend on a
      # wrapper action's package-manager discovery.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plugins-registry/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
        working-directory: plugins-registry
      - name: Deploy notemd-plugins to Cloudflare Workers
        run: pnpm exec wrangler deploy
        working-directory: plugins-registry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
