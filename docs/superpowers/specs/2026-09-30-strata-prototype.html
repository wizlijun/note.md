<div id="strata-terrain" aria-label="STRATA 层峦插件设计原型">
  <header class="st-toolbar">
    <div class="st-brand"><i data-lucide="mountain" aria-hidden="true"></i><strong>STRATA</strong><span>层峦</span></div>
    <div class="st-dates"><label>文档日期 <input type="date" data-from value="2026-09-01" aria-label="开始日期"></label><span>—</span><input type="date" data-to value="2026-09-30" aria-label="结束日期"><select data-range aria-label="日期快捷范围"><option value="30">近 30 天</option><option value="7">近 7 天</option><option value="90">近 90 天</option><option value="custom">自定义</option></select></div>
    <div class="st-actions"><div class="st-view-switch" aria-label="地形视角"><button type="button" data-view="2d" aria-pressed="false" class="cursor-interaction">等高线</button><button type="button" data-view="3d" aria-pressed="true" class="cursor-interaction">三维山体</button></div><button type="button" data-personal aria-pressed="true" class="cursor-interaction">个人优先</button><button type="button" data-relations aria-pressed="false" class="cursor-interaction">关系</button><button type="button" data-settings aria-expanded="false" class="cursor-interaction"><i data-lucide="sliders-horizontal" aria-hidden="true"></i><span>设置</span></button></div>
  </header>
  <div class="st-settings" hidden>
    <label>知识层级 <select data-level><option value="auto">跟随缩放</option><option value="domain">领域</option><option value="topic">主题</option><option value="knowledge">知识点</option></select></label>
    <label>地形细节 <select data-detail><option value="12">丰富细节</option><option value="8">简洁线条</option></select></label>
    <label><input type="checkbox" data-public checked> 显示公开材料</label>
    <span class="st-settings-note">固定对数高程 · 日期切换保持布局 · 二维与三维共用地形</span>
  </div>
  <div class="st-error" role="alert" hidden></div>
  <div class="st-map">
    <canvas class="st-gl" aria-label="三维知识山体，拖动旋转，滚轮缩放"></canvas>
    <canvas class="st-overlay" aria-label="知识等高线地图；使用地图上的主题按钮查看证据"></canvas>
    <div class="st-map-heading"><span class="st-eyebrow">YOUR KNOWLEDGE, IN RELIEF</span><h2>每一座山，都有你的来处。</h2><div class="st-status" aria-live="polite"></div></div>
    <div class="st-labels" aria-label="地图中的主题和知识点"></div>
    <div class="st-empty" hidden>这个日期范围内还没有知识点。<span>试试 2026 年 9 月的示例。</span></div>
    <div class="st-legend"><span><b class="st-diamond">◆</b> 个人独有</span><span><b class="st-dot">●</b> 其他材料</span><span class="st-legend-height">相对高程 · 固定对数刻度</span></div>
    <div class="st-caption"><span>合成数据 · 交互设计原型</span><span data-lod>领域</span></div>
    <div class="st-map-controls"><div class="st-orbit"><button type="button" data-turn="-1" aria-label="向左旋转山体" class="cursor-interaction">↶</button><button type="button" data-turn="1" aria-label="向右旋转山体" class="cursor-interaction">↷</button><button type="button" data-tilt="1" aria-label="更俯视山体" class="st-angle cursor-interaction">俯</button><button type="button" data-tilt="-1" aria-label="更侧视山体" class="st-angle cursor-interaction">侧</button></div><button type="button" data-zoom-in aria-label="放大地图" class="cursor-interaction">＋</button><button type="button" data-zoom-out aria-label="缩小地图" class="cursor-interaction">−</button><button type="button" data-home aria-label="查看全景" class="cursor-interaction"><i data-lucide="maximize" aria-hidden="true"></i><span>全景</span></button></div>
    <section class="st-evidence" hidden aria-label="知识证据详情">
      <div class="st-evidence-top"><span>原文证据</span><button type="button" data-close aria-label="关闭证据" class="cursor-interaction">×</button></div>
      <div class="st-evidence-body"></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
/* global THREE, d3 */

/**
 * THREE r160 terrain view of the caller's scalar field; no generated mountains.
 * Coordinates passed to heightAt/project and view.targetX/Y are normalized [0,1].
 * yaw/pitch are radians (pitch is elevation above the map), distance is world units.
 * Pass a NEW field/contours reference after changing their contents. Camera-only
 * renders reuse geometry, heights, normals and the contour texture.
 */
function createTerrain3D(canvas, getInk) {
  if (typeof THREE === 'undefined' || typeof d3 === 'undefined') {
    throw new Error('STRATA 3D requires THREE r160 and D3.');
  }
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 90);
  const worldWidth = 12, worldDepth = 8;
  const segmentsX = 480, segmentsY = 312;
  const geometry = new THREE.PlaneGeometry(worldWidth, worldDepth, segmentsX, segmentsY);
  geometry.rotateX(-Math.PI / 2);
  const positions = geometry.attributes.position;
  const colors = new Float32Array(positions.count * 3);
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const rawHeights = new Float32Array(positions.count);
  const baseElevations = new Float32Array(positions.count);

  const textureCanvas = document.createElement('canvas');
  textureCanvas.width = 2048;
  textureCanvas.height = 1366;
  const textureContext = textureCanvas.getContext('2d');
  if (!textureContext) {
    geometry.dispose(); renderer.dispose(); renderer.forceContextLoss();
    throw new Error('STRATA contour texture could not create a 2D context.');
  }
  const contourTexture = new THREE.CanvasTexture(textureCanvas);
  contourTexture.colorSpace = THREE.SRGBColorSpace;
  contourTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const material = new THREE.MeshStandardMaterial({
    color: 0xffffff, vertexColors: true, map: contourTexture,
    roughness: 0.94, metalness: 0, side: THREE.FrontSide,
  });
  const terrain = new THREE.Mesh(geometry, material);
  terrain.castShadow = true;
  terrain.receiveShadow = true;
  scene.add(terrain);

  // A thin skirt connects actual boundary heights to a flat map slab.
  const perimeter = [];
  for (let x = 0; x <= segmentsX; x++) perimeter.push(x);
  for (let y = 1; y <= segmentsY; y++) perimeter.push(y * (segmentsX + 1) + segmentsX);
  for (let x = segmentsX - 1; x >= 0; x--) perimeter.push(segmentsY * (segmentsX + 1) + x);
  for (let y = segmentsY - 1; y > 0; y--) perimeter.push(y * (segmentsX + 1));
  const skirtGeometry = new THREE.BufferGeometry();
  const skirtPositions = new Float32Array(perimeter.length * 6);
  const skirtIndices = [];
  for (let i = 0; i < perimeter.length; i++) {
    const j = (i + 1) % perimeter.length;
    skirtIndices.push(i * 2, j * 2, i * 2 + 1, j * 2, j * 2 + 1, i * 2 + 1);
  }
  skirtGeometry.setAttribute('position', new THREE.BufferAttribute(skirtPositions, 3));
  skirtGeometry.setIndex(skirtIndices);
  const skirtMaterial = new THREE.MeshStandardMaterial({ roughness: 1, side: THREE.DoubleSide });
  const skirt = new THREE.Mesh(skirtGeometry, skirtMaterial);
  skirt.castShadow = true;
  skirt.receiveShadow = true;
  scene.add(skirt);

  const slabGeometry = new THREE.BoxGeometry(worldWidth + 0.035, 0.2, worldDepth + 0.035);
  const slabMaterial = new THREE.MeshStandardMaterial({ roughness: 1 });
  const slab = new THREE.Mesh(slabGeometry, slabMaterial);
  slab.position.y = -0.14;
  slab.castShadow = true;
  slab.receiveShadow = true;
  scene.add(slab);

  const groundGeometry = new THREE.PlaneGeometry(200, 200);
  const groundMaterial = new THREE.ShadowMaterial({ color: 0x1d2923, opacity: 0.16 });
  const ground = new THREE.Mesh(groundGeometry, groundMaterial);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.245;
  ground.receiveShadow = true;
  scene.add(ground);

  const hemisphere = new THREE.HemisphereLight(0xf4f7f1, 0x5a695d, 0.95);
  scene.add(hemisphere);
  const sunlight = new THREE.DirectionalLight(0xfff5df, 2.4);
  sunlight.position.set(-5, 10, 6);
  sunlight.castShadow = true;
  sunlight.shadow.mapSize.set(2048, 2048);
  Object.assign(sunlight.shadow.camera, { left: -9, right: 9, top: 8, bottom: -8, near: 0.5, far: 32 });
  sunlight.shadow.bias = -0.00015;
  sunlight.shadow.normalBias = 0.028;
  sunlight.shadow.radius = 2;
  scene.add(sunlight);
  scene.add(sunlight.target);

  let field = null, gridWidth = 0, gridHeight = 0, verticalScale = 1;
  let previousContours = null, previousLevels = '', previousTextureKey = '', previousPalette = '';
  let cssWidth = 1, cssHeight = 1, pixelRatio = 0, disposed = false, hasRendered = false;
  const projected = new THREE.Vector3();
  const target = new THREE.Vector3();
  const interpolatedColor = new THREE.Color();
  const lowColor = new THREE.Color(), midColor = new THREE.Color(), highColor = new THREE.Color();
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
  const finite = (value, fallback) => Number.isFinite(value) ? value : fallback;
  const ink = (name, fallback) => getInk(name) || fallback;
  const elevation = value => 0.24 * Math.log1p(Math.max(0, value) / 0.012);

  // D3 contour coordinates place cell i at i + 0.5, rather than at i.
  function heightAt(x, y) {
    if (!field) return 0;
    const gx = clamp(finite(x, 0) * gridWidth - 0.5, 0, gridWidth - 1);
    const gy = clamp(finite(y, 0) * gridHeight - 0.5, 0, gridHeight - 1);
    const x0 = Math.floor(gx), y0 = Math.floor(gy);
    const x1 = Math.min(x0 + 1, gridWidth - 1), y1 = Math.min(y0 + 1, gridHeight - 1);
    const tx = gx - x0, ty = gy - y0;
    const a = finite(field[y0 * gridWidth + x0], 0), b = finite(field[y0 * gridWidth + x1], 0);
    const c = finite(field[y1 * gridWidth + x0], 0), d = finite(field[y1 * gridWidth + x1], 0);
    return Math.max(0, (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty);
  }

  function updateHeights(resample) {
    for (let i = 0; i < positions.count; i++) {
      if (resample) {
        const x = positions.getX(i) / worldWidth + 0.5;
        const y = positions.getZ(i) / worldDepth + 0.5;
        rawHeights[i] = heightAt(x, y);
        baseElevations[i] = elevation(rawHeights[i]);
      }
      positions.setY(i, baseElevations[i] * verticalScale);
    }
    positions.needsUpdate = true;
    geometry.computeVertexNormals();
    geometry.computeBoundingBox();
    geometry.computeBoundingSphere();
    for (let i = 0; i < perimeter.length; i++) {
      const source = perimeter[i], offset = i * 6;
      skirtPositions[offset] = skirtPositions[offset + 3] = positions.getX(source);
      skirtPositions[offset + 1] = positions.getY(source);
      skirtPositions[offset + 4] = -0.041;
      skirtPositions[offset + 2] = skirtPositions[offset + 5] = positions.getZ(source);
    }
    skirtGeometry.attributes.position.needsUpdate = true;
    skirtGeometry.computeVertexNormals();
    skirtGeometry.computeBoundingSphere();
    renderer.shadowMap.needsUpdate = true;
  }

  function updateColors() {
    const normals = geometry.attributes.normal;
    for (let i = 0; i < positions.count; i++) {
      // Fixed height transfer keeps color comparable across date ranges.
      const band = clamp(baseElevations[i] / 0.98, 0, 1);
      if (band < 0.55) interpolatedColor.copy(lowColor).lerp(midColor, band / 0.55);
      else interpolatedColor.copy(midColor).lerp(highColor, (band - 0.55) / 0.45);
      // Steep slopes expose a restrained rock color; no extra displacement/noise.
      const slope = clamp((1 - normals.getY(i) - 0.18) * 1.5, 0, 0.34);
      interpolatedColor.lerp(highColor, slope);
      interpolatedColor.toArray(colors, i * 3);
    }
    geometry.attributes.color.needsUpdate = true;
  }

  function updateTexture(contours, opacity, detail, lineColor) {
    const ctx = textureContext, tw = textureCanvas.width, th = textureCanvas.height;
